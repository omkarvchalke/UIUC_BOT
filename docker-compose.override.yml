# Auto-loaded by plain `docker compose up` (no -f flags) for local
# development -- NOT loaded when explicitly running with
# docker-compose.prod.yml. Publishes Postgres's port to the host so it's
# reachable for local debugging (psql, tests run outside Docker);
# production has no reason to expose the data store beyond the Docker
# network the backend already shares with it.
services:
  postgres:
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
