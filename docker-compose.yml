services:
  postgres:
    # pgvector/pgvector, not plain postgres: bundles the pgvector extension
    # (CREATE EXTENSION vector, used by document_chunks.embedding) on top of
    # the same postgres:16 base -- this used to be a separate Qdrant
    # service/volume entirely; folding vector storage into Postgres removes
    # a whole service to run and (for the hosted free tier this is aimed
    # at, see README) a whole separate free-tier account to keep alive.
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-illiniguide}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-illiniguide}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-illiniguide}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # backend/.env.example is documentation only, never loaded here -- it
    # used to be a required env_file, which is exactly what made it easy to
    # mistake for the real config file (a real GROQ_API_KEY ended up
    # committed there more than once because of it). The only file that can
    # supply real secrets is backend/.env (gitignored, optional).
    env_file:
      - path: backend/.env
        required: false
    environment:
      APP_NAME: ${APP_NAME:-IlliniAssist AI}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-illiniguide}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-illiniguide}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      EMBEDDING_MODEL_NAME: ${EMBEDDING_MODEL_NAME:-BAAI/bge-small-en-v1.5}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3000}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')\""]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
